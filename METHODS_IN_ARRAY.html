<html>
    <body>
        <h2>Methods in Array</h2>
        <h2>join() and pop()</h2>
        <p id="my join"></p>
        <p id="myfirstpop"></p>
        <p id ="mysecondpop"></p>
        <script>
            var fruits = ["Banana", "Orange", "Apple", "Mango"];
            document.getElementById("my join").innerHTML = fruits.join(" * ");
            document.getElementById("myfirstpop").innerHTML = fruits;
            fruits.pop();
            document.getElementById("mysecondpop").innerHTML = fruits;
            fruits.pop();
            document.getElementById("mysecondpop").innerHTML = fruits;
        </script>


    </body>>
</html>
