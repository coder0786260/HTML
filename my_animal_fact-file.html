<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Facts</title>
    <style>
        body {
            background-color:rgb(7, 94, 7);
            font-family:Arial, sans-serif;
        }
        .fact-file {
            background-color:lightyellow;
            color:darkslategray;
            width:260px;
            padding: 25px;
            border: 4px solid rgb(15, 44, 15);
            margin: 30px;
            }
            .animal-name {
                color:rgb(195, 195, 10);
                font-size: 22px;
            }
            .detail {
                color: darkslategray;
            }
            .cool-fact {
                color: darkorange;
                font-style: italic;
            }
    </style>    
                
    </head>

<body>
    
    <div class="fact-file">
        <h2 class="animal-name">SNOW LEOPARD</h2>
        <p class="detail">Type:big cat</p>
        <p class="detail">Habitat:Mountainous regions of Central and South Asia</p>
        <p class="detail">Diet:Carnivore</p>
        <p class="detail">Lifespan:10-12 years in the wild</p>
        <p class="cool-fact">Fun Fact:Snow leopards are known for their beautiful spotted fur and are sometimes called "ghosts of the mountains" due to their elusive nature.</p>
    </div>
</body>
</html>
