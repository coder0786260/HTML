<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my science lab</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f4fff4;
            font-family: Arial, sans-serif;
        }
        .jumbotron {
            background-color: #e6f9ec;
            border-left: 6px solid #ff5a43;
        }
        .jumbotron h1 {
            color: #ff5a43;
        }
        .selection-title {
            color: #ff5a43;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        p {
            font-weight: bold;
            margin-bottom: 5px;
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1 >My Science Lab</h1>
            <p class="lead">Welcome to my science lab where we explore the wonders of science!</p>

            <button class="btn btn-primary">chemistry</button>
            <button class="btn btn-success">biology</button>
            <button class="btn btn-warning">physics</button>
            <button class="btn btn-danger">astronomy</button>
        </div>
    </div>


    <div class="container">

        <h2 class="selection-title">Experiments Completed<span class="badge badge-danger">4</span></h2>

        <p>Chemistry <span class="badge badge-primary">7 experiments</span></p>
        <p>Biology <span class="badge badge-success">5 experiments</span></p>
        <p>Physics <span class="badge badge-warning">3 experiments</span></p>
        <p>Astronomy <span class="badge badge-dark">4 experiments</span></p>


        <h2 class="selection-title">Research Progress</h2>
        <p>Chemistry</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 85%">85%</div>
        </div>

        <p>Biology</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 70%">70%</div>
        </div>

        <p>Physics</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 55%">55%</div>
        </div>

        <p>Astronomy</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-dark" style="width: 40%">40%</div>
        </div>

    </div>
</body>
</html>
