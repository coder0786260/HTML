<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my planet card</title>
</head>
<body>

    <h1>my planet card</h1>
    <p>use javascript to build planet cards</p>
    <button onclick="showplanets()">show planets</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>

    <script>
        class planet {
            constructor(name,fact) {
                this.name = name;
                this.fact = fact;
            }
            descibe()  {
                return this.name + "; " + this.fact;
            }
        }

        function showplanets() {
            let p1 = new planet("earth","the only planet with life");
            let p2 = new planet("mars","known as red planet");
            let p3 = new planet("saturns","has rings made of ice");
            }

            document.getElementById("card1").innerHTML =
           "<div class='card'><div class='planet-name'>" + p1.name + 
            "</div>" +
                     "<div class='planet-fact'>" + p1.describe() + "</div>  
           </div>";



    </script>
    
</body>
</html>
