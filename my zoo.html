<html>
    <head>
        <title>My Zoo</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: aliceblue;
                text-align: center;
                padding: 30px;
            }
            h1 {
              color: #ff5a43;
            }
            #zoo {
                border: 2px solid #ff5a43;
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius: 10px;
                background-color: white;
            }
            .zone {
                 border: 1px solid #ff5a43;
                 margin: 6px 0;
                 padding: 8px 12px;
                 border-radius: 6px;
                 text-align: left;
            }
            button {
                background-color: #ff5a43;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }
                           

        </style>
    </head>
    <body>
        
        <h1>My Zoo</h1>

        <p>use javascript and dom to put the animals in their cages</p>

        <div id="zoo">
            <div class="zone">zone1: <span id="zone1"></span></div>
            <div class="zone">zone2: <span id="zone2"></span></div>
            <div class="zone">zone3: <span id="zone3"></span></div>
            <div class="zone">total animals: <span id="total"></span></div>
        </div>

        <br>

        <button onclick="openZoo()">Open Zoo</button>

        <p id="zooStatus"></p>

        <script>

            function openZoo() {

            document.getElementById("zone1").innerHTML = "lion";

            document.getElementById("zone2").innerHTML = "tiger";

            document.getElementById("zone3").innerHTML = "deer";

            document.getElementById("total").innerHTML = "3";

            document.getElementById("zoo").style.backgroundColor = "lightgreen";

            document.getElementById("zooStatus").innerHTML = document.title + " is now open!";

            }
                
        </script>


    </body>
</html>
