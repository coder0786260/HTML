<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my super hero card</title>

    <style>

    body{
        background-color:darkblue;
        color: aliceblue;
        font-family: arial,sans-serif;
    }

    .hero-name{
        font-size: 60px;
        font-weight: bold;
        color: yellow;
        text-shadow: rgb(255, 132, 0);
    }

    .tagline{
        font-style:italic;
        color:lightblue;
        text-transform: capitalize;
    }

    .label{
        text-transform: uppercase;
        text-decoration: underline;
        color:coral;
    }

    .power{
        font-weight:bold;
        color: lightgreen;
    }

    .weakness{
        text-decoration: line-through;
        color:gray
    }

    .badge{
        font-size: 28px;
        font-weight: bold;
        color:gold;
        transform: rotate(15deg);
    }

    .made-by{
        color: coral;
        font-style: italic;
    }
    </style>

</head>
<body>
  
    
<h1 class="hero-name">thunder kid</h1>
<p classs="tagline">the most powerful kid in school</p>

<h2 class="label">super powers</h2>
<p class="powers">can run faster than an cheetah</p>
<p class="powers">can lift a school bus</p>


<h2 class="label">weaknesses</h2>
<p class="weakness">maths home work</p>
<p class="weakness">broccoli</p>

<p class="badge">top hero</p>

<p class=made-by>created by JAFFER</p>


</body>
</html>
