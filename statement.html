<html>

<body>

<h2>JavaScript Statements</h2>
<p>JavaScript statements are instructions that tell the browser to perform specific actions.</p>

<p id="demo"></p>

<script>
    var x,y,z;
     x = 5;
     y = 10;
     z = x + y;

    document.getElementById("demo").innerHTML = "The value of z is " + z+".";
</script>

</body>

</html>
