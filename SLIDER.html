<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slider</title>
</head>
<body>
    <section>
        <img class="sliderimg" src="Untitled Design (1).png" alt="Image 1">
        <img class="sliderimg" src="Untitled Design (5).png" alt="Image 2">
        <img class="sliderimg" src="Untitled Design (3).png" alt="Image 3">
    </section>
    <script>
        var myIndex = 0;
        carousel();

        function carousel() {
            var i;
            var x = document.getElementsByClassName("sliderimg");
            for (i =0; i < x.length; i++) {
                x[i].style.display = "none";  
            }
            
            myIndex++;
            if (myIndex > x.length) {myIndex = 1}
            x[myIndex-1].style.display = "block";
            setTimeout(carousel, 3000);
        }
    </script>
</body>
</html>
